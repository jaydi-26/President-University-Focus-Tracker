<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Class - PUFT</title>
    <link rel="stylesheet" href="jc button.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="lobby">
        <!-- Frame -->
        <div class="frame"></div>

        <!-- Follow Button / Respond Button -->
        <button id="btnB" class="follow-button">
            <div class="button-background">
                <div class="button-shadow"></div>
            </div>
            <p class="button-text">Respond</p>
        </div>

            

<script>
(() => {
  const btnB = document.getElementById("btnB");
  const status = document.getElementById("status");

  const ON_TIME = 10 * 1000;
  const OFF_TIME = 10 * 1000;

  let lastEnabled = null;

  function render() {
    const state = localStorage.getItem("seq_state");
    const cycle = localStorage.getItem("seq_cycle");
    const start = Number(localStorage.getItem("seq_phase_start"));

    if (!state || state === "done") {
      setEnabled(false);
      status.textContent = "Finished";
      return;
    }

    const elapsed = Date.now() - start;

    if (state === "on") {
      setEnabled(true);
      const remain = Math.ceil((ON_TIME - elapsed) / 1000);
      status.textContent = `ON (cycle ${cycle}/3 — ${remain}s)`;
    }

    if (state === "off") {
      setEnabled(false);
      const remain = Math.ceil((OFF_TIME - elapsed) / 1000);
      status.textContent = `OFF (cycle ${cycle}/3 — ${remain}s)`;
    }
  }

  function setEnabled(val) {
    if (lastEnabled !== val) {
      btnB.disabled = !val;
      lastEnabled = val;
    }
  }

  // 🔘 Button press → notify Room A
  btnB.addEventListener("click", () => {
    localStorage.setItem("seq_press_event", Date.now());
  });

  setInterval(render, 500);
  window.addEventListener("storage", render);
  render();
})();

  btnB.addEventListener("click", () => {
  localStorage.setItem("seq_press_event", Date.now());
});


</script>


        <!-- Bottom Bar -->
