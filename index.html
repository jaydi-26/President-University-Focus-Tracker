<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFT — President University Focus Tracker</title>
    <meta name="description"
        content="President University Focus Tracker — Empowering focused learning, one session at a time.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1b2d45;
            --teal: #3a7ca5;
            --red: #c0392b;
            --red-glow: rgba(192, 57, 43, 0.35);
            --teal-glow: rgba(58, 124, 165, 0.35);
            --bg: #0d1520;
            --surface: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        /* ─── CANVAS PARTICLES ─────────────────────────────────────────── */
        #particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ─── DEEP GRADIENT BACKGROUND ────────────────────────────────── */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 30%, rgba(58, 124, 165, 0.18) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 80% 70%, rgba(192, 57, 43, 0.14) 0%, transparent 65%),
                radial-gradient(ellipse 100% 100% at 50% 50%, #0f1e30 0%, #0d1520 100%);
        }

        /* ─── ANIMATED GRID OVERLAY ────────────────────────────────────── */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            background-image:
                linear-gradient(rgba(58, 124, 165, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(58, 124, 165, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 80%);
            animation: gridScroll 20s linear infinite;
        }

        @keyframes gridScroll {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 60px 60px;
            }
        }

        /* ─── GLOWING ORBS ─────────────────────────────────────────────── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            mix-blend-mode: screen;
            z-index: 1;
            pointer-events: none;
        }

        .orb-teal {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(58, 124, 165, 0.3) 0%, transparent 70%);
            top: -15%;
            left: -10%;
            animation: floatOrb1 18s ease-in-out infinite alternate;
        }

        .orb-red {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(192, 57, 43, 0.22) 0%, transparent 70%);
            bottom: -15%;
            right: -10%;
            animation: floatOrb2 22s ease-in-out infinite alternate;
        }

        .orb-navy {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(27, 45, 69, 0.6) 0%, transparent 70%);
            top: 40%;
            left: 40%;
            animation: floatOrb3 15s ease-in-out infinite alternate;
        }

        @keyframes floatOrb1 {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(8%, 12%) scale(1.15);
            }
        }

        @keyframes floatOrb2 {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(-10%, -8%) scale(1.2);
            }
        }

        @keyframes floatOrb3 {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(-5%, 5%) scale(0.9);
            }
        }

        /* ─── MAIN CONTENT CARD ────────────────────────────────────────── */
        .splash-card {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
                filter: blur(8px);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        /* ─── LOGO RING ─────────────────────────────────────────────────── */
        .logo-ring-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 36px;
        }

        .logo-ring {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            background:
                linear-gradient(#0d1520, #0d1520) padding-box,
                conic-gradient(from 0deg, var(--teal), var(--red), var(--teal)) border-box;
            animation: spinRing 8s linear infinite;
        }

        .logo-ring-outer {
            position: absolute;
            width: 270px;
            height: 270px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: spinRing 14s linear infinite reverse;
        }

        @keyframes spinRing {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* ring dots */
        .logo-ring::before,
        .logo-ring::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }

        .logo-ring::before {
            background: var(--teal);
            left: -4px;
            box-shadow: 0 0 12px var(--teal-glow), 0 0 24px var(--teal-glow);
        }

        .logo-ring::after {
            background: var(--red);
            right: -4px;
            box-shadow: 0 0 12px var(--red-glow), 0 0 24px var(--red-glow);
        }

        .logo-inner {
            position: relative;
            z-index: 2;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(13, 21, 32, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 40px rgba(58, 124, 165, 0.15),
                0 0 80px rgba(192, 57, 43, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            animation: logoPulse 4s ease-in-out infinite 1.2s;
        }

        @keyframes logoPulse {

            0%,
            100% {
                box-shadow:
                    0 0 40px rgba(58, 124, 165, 0.15),
                    0 0 80px rgba(192, 57, 43, 0.08),
                    inset 0 1px 0 rgba(255, 255, 255, 0.06);
            }

            50% {
                box-shadow:
                    0 0 60px rgba(58, 124, 165, 0.3),
                    0 0 120px rgba(192, 57, 43, 0.15),
                    inset 0 1px 0 rgba(255, 255, 255, 0.06);
            }
        }

        .logo-inner img {
            width: 110px;
            height: auto;
            border-radius: 50%;
        }

        /* ─── BRAND TEXT ────────────────────────────────────────────────── */
        .brand-title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 20px;
            margin-bottom: 6px;
            animation: textSlide 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }

        .brand-subtitle {
            font-size: 22px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 4px;
            animation: textSlide 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
        }

        .brand-subtitle strong {
            font-weight: 700;
            background: linear-gradient(135deg, #5ea8d4 0%, #ffffff 50%, #e07070 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-tagline {
            font-size: 11.5px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 48px;
            animation: textSlide 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both;
        }

        @keyframes textSlide {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ─── PROGRESS SECTION ──────────────────────────────────────────── */
        .progress-section {
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            animation: textSlide 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both;
        }

        .progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0%;
            background: linear-gradient(90deg, var(--teal), #7ec8e3, var(--red));
            border-radius: 99px;
            animation: progressGrow 4.5s cubic-bezier(0.4, 0, 0.6, 1) forwards;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(126, 200, 227, 0.6);
        }

        @keyframes progressGrow {
            0% {
                width: 0%;
            }

            20% {
                width: 15%;
            }

            50% {
                width: 55%;
            }

            80% {
                width: 82%;
            }

            100% {
                width: 100%;
            }
        }

        .progress-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
        }

        .status-dot::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 8px var(--teal-glow);
            animation: dotBlink 1.5s ease-in-out infinite;
        }

        @keyframes dotBlink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .status-percent {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            font-family: 'Inter', monospace;
        }

        /* ─── BOTTOM BADGE ──────────────────────────────────────────────── */
        .footer-badge {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 99px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            animation: fadeUpIn 2s ease 1s both;
        }

        .footer-badge span {
            color: rgba(58, 124, 165, 0.7);
        }

        @keyframes fadeUpIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- Background layers -->
    <div class="bg-layer"></div>
    <div class="grid-overlay"></div>
    <div class="orb orb-teal"></div>
    <div class="orb orb-red"></div>
    <div class="orb orb-navy"></div>

    <!-- Particle canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Main splash content -->
    <div class="splash-card" id="splash-card">

        <!-- Logo with spinning ring -->
        <div class="logo-ring-wrapper">
            <div class="logo-ring-outer"></div>
            <div class="logo-ring"></div>
            <div class="logo-inner">
                <img src="puft.png" alt="PUFT Logo">
            </div>
        </div>

        <!-- Brand text -->
        <p class="brand-title">President University</p>
        <h1 class="brand-subtitle"><strong>Focus Tracker</strong></h1>
        <p class="brand-tagline">Powered by intelligence &bull; Built for learning</p>

        <!-- Progress bar -->
        <div class="progress-section">
            <div class="progress-track">
                <div class="progress-fill" id="prog-fill"></div>
            </div>
            <div class="progress-row">
                <div class="status-dot" id="status-label">Initializing</div>
                <div class="status-percent" id="status-pct">0%</div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="footer-badge">
        <span>PUFT</span> |&nbsp; est. 2026
    </div>

    <script>
        /* ── Particle System ─────────────────────────────────────────── */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const COLORS = [
            'rgba(58, 124, 165, ',
            'rgba(192, 57, 43, ',
            'rgba(255, 255, 255, '
        ];

        function createParticle() {
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            return {
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.4 + 0.3,
                vx: (Math.random() - 0.5) * 0.25,
                vy: -Math.random() * 0.4 - 0.1,
                alpha: Math.random() * 0.5 + 0.1,
                color,
                life: Math.random() * 200 + 100,
                age: 0
            };
        }

        for (let i = 0; i < 90; i++) particles.push(createParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.age++;
                const progress = p.age / p.life;
                const a = p.alpha * (1 - Math.pow(progress, 2));
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color + a + ')';
                ctx.fill();
                if (p.age >= p.life || p.y < -10) particles[i] = createParticle();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* ── Status label cycling ────────────────────────────────────── */
        const labels = ['Initializing', 'Connecting', 'Verifying', 'Loading UI', 'Ready'];
        const timings = [0, 900, 1800, 2700, 3800];   // ms from start
        const labelEl = document.getElementById('status-label');
        const pctEl = document.getElementById('status-pct');

        timings.forEach((t, i) => {
            setTimeout(() => { labelEl.textContent = labels[i]; }, t);
        });

        /* ── Percentage counter ──────────────────────────────────────── */
        const totalMs = 4500;
        const startTs = performance.now();
        function tickPct(ts) {
            const elapsed = Math.min(ts - startTs, totalMs);
            const pct = Math.round((elapsed / totalMs) * 100);
            pctEl.textContent = pct + '%';
            if (pct < 100) requestAnimationFrame(tickPct);
        }
        requestAnimationFrame(tickPct);

        /* ── Redirect with fade-out ──────────────────────────────────── */
        const TOTAL_DURATION = 5000;
        const FADE_OUT_TIME = 900;

        setTimeout(() => {
            const card = document.getElementById('splash-card');
            document.body.style.transition = `opacity ${FADE_OUT_TIME}ms ease, filter ${FADE_OUT_TIME}ms ease`;
            document.body.style.opacity = '0';
            document.body.style.filter = 'blur(16px) brightness(2)';
            setTimeout(() => { window.location.href = 'login.html'; }, FADE_OUT_TIME);
        }, TOTAL_DURATION - FADE_OUT_TIME);
    </script>

</body>

</html>
