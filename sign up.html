<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PUFT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai:wght@400&family=Cabin:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="proto-container">
        <!-- Sign Up Card -->
        <div class="signup-card"></div>
        
        <!-- Background Circle -->
        <div class="background-circle">
            <svg class="circle-svg" fill="none" preserveAspectRatio="none" viewBox="0 0 612.011 591.988">
                <ellipse cx="306.006" cy="295.994" fill="url(#paint0_linear_0_118)" rx="306.006" ry="295.994" />
                <defs>
                    <linearGradient gradientUnits="userSpaceOnUse" id="paint0_linear_0_118" x1="306.006" x2="306.006" y1="0" y2="753.044">
                        <stop stop-color="#3D0707" />
                        <stop offset="0.884615" stop-color="#A93737" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
        
        <!-- Email Input Component -->
        <div class="input-component email-component">
            <div class="input-bg"></div>
            <p class="input-text">Email</p>
        </div>
        
        <!-- Password Input Component -->
        <div class="input-component password-component">
            <div class="input-bg"></div>
            <p class="input-text password-text">Password</p>
        </div>
        
        <!-- Sign Up Title -->
        <p class="signup-title">Sign Up</p>
        
        <!-- Input Underlines -->
        <div class="underline email-underline">
            <div class="underline-inner">
                <svg class="underline-svg" fill="none" preserveAspectRatio="none" viewBox="0 0 295 1">
                    <line stroke="black" x2="295" y1="0.5" y2="0.5" />
                </svg>
            </div>
        </div>
        
        <div class="underline password-underline">
            <div class="underline-inner">
                <svg class="underline-svg" fill="none" preserveAspectRatio="none" viewBox="0 0 295 1">
                    <line stroke="black" x2="295" y1="0.5" y2="0.5" />
                </svg>
            </div>
        </div>
        
        <!-- Sign In Button -->
        <div class="signin-button"></div>
        <p class="signin-text">Sign In</p>
        
        <!-- Already have account text -->
        <p class="account-text">Already have an account?</p>
        
        <!-- Logo -->
        <div class="logo-container">
            <img alt="PUFT Logo" class="logo-image" src="your-logo-path-here.png" />
        </div>
    </div>
</body>
</html>
